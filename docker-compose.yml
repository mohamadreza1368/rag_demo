services:
  rag-studio:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-dockerhub.ime.co.ir/}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://linux.repo.ime.co.ir/repository/debian}
        PYPI_INDEX: ${PYPI_INDEX:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple}
        PYPI_HOST: ${PYPI_HOST:-pypi.repo.ime.co.ir}
    image: dockerhub.ime.co.ir/rag-studio:latest
    container_name: rag_studio
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PORT:-8089}:8080"
    volumes:
      - .:/app
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request, os; resp = urllib.request.urlopen(\"http://localhost:\" + str(os.environ.get(\"PORT\", 8080)) + \"/health\", timeout=3); resp.read()' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    environment:
      - PORT=8080
      - DOCKER=1
      - NO_BROWSER=1
      - HF_TOKEN=${HF_TOKEN:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,host.docker.internal}
    env_file:
      - path: .env
        required: false
